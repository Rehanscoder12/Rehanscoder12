</style><rect width="100%" height="100%" rx="24" fill="url(#bgGrad)"/><text x="36" y="55" class="label cyan">01 / ABOUT &amp; INTERESTS</text><text x="36" y="105" class="heading white">Curious by default.</text><text x="36" y="150" class="body muted">I enjoy building useful software,</text><text x="36" y="180" class="body muted">practising DSA, and sharing tech.</text><rect x="36" y="220" width="350" height="48" rx="12" fill="#102747" stroke="#247bff"/><text x="56" y="250" class="small white">LEARN → BUILD → REFINE</text><g opacity="0" class="smil"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" begin="0s" dur="4s" repeatCount="indefinite"/><rect x="440" y="130" width="500" height="125" rx="18" fill="#0d1c34" stroke="#247bff"/><text x="470" y="175" class="heading cyan">CODING</text><text x="470" y="210" class="body white">Building projects and learning by shipping.</text><text x="875" y="205" text-anchor="middle" class="heading red">&amp;lt;/&amp;gt;</text></g><g opacity="0" class="smil"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" begin="4s" dur="4s" repeatCount="indefinite"/><rect x="440" y="130" width="500" height="125" rx="18" fill="#0d1c34" stroke="#247bff"/><text x="470" y="175" class="heading cyan">DSA</text><text x="470" y="210" class="body white">Practising patterns and problem solving.</text><text x="875" y="205" text-anchor="middle" class="heading red">{ }</text></g><g opacity="0" class="smil"><animate attributeName="opacity" values="0;1;0" keyTimes="0;.15;1" begin="8s" dur="4s" repeatCount="indefinite"/><rect x="440" y="130" width="500" height="125" rx="18" fill="#0d1c34" stroke="#247bff"/><text x="470" y="175" class="heading cyan">TECH CONTENT</text><text x="470" y="210" class="body white">Sharing what I learn about coding.</text><text x="875" y="205" text-anchor="middle" class="heading red">▶</text></g><text x="442" y="292" class="small muted">Interests rotate every 4 seconds · static fallback included</text></s