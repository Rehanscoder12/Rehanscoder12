<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="330" viewBox="0 0 1000 330" role="img"><defs><linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#101b35"/></linearGradient><linearGradient id="shine"><stop stop-color="#247bff"/><stop offset=".55" stop-color="#55e3ff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>
:root{color-scheme:dark} .bg{fill:#070b16}.panel{fill:#0b1427;stroke:#247bff;stroke-opacity:.65;stroke-width:1.2}.muted{fill:#a9bddb}.white{fill:#f5f7ff}.blue{fill:#48a2ff}.red{fill:#ff5268}.cyan{fill:#55e3ff}.small{font:16px 'DejaVu Sans',Arial,sans-serif}.body{font:19px 'DejaVu Sans',Arial,sans-serif}.label{font:700 16px 'DejaVu Sans',Arial,sans-serif;letter-spacing:2px}.heading{font:700 34px 'DejaVu Sans',Arial,sans-serif}.big{font:700 58px 'DejaVu Sans',Arial,sans-serif}.glow{filter:url(#glow)} .line{stroke:#247bff;stroke-opacity:.65;fill:none}.dots{fill:#247bff;opacity:.22}
